<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사전등록 관리 | 2026 대한민국 사회서비스 박람회</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/register.css">
  <link rel="stylesheet" href="css/notice.css">
  <link rel="stylesheet" href="css/register-admin.css">
</head>
<body data-breadcrumb='[{"label":"홈","href":"index.html"},{"label":"사전등록 관리"}]'>
  <div id="site-header"></div>
  <main class="page-main">
    <div id="breadcrumb"></div>
    <div class="page-inner">
      <div class="content-card" id="admin-gate">
        <h1 class="section-title"><span class="dot"></span>사전등록 DB 관리</h1>
        <p class="form-hint admin-gate-hint">관리자 비밀번호로 로그인하면 서버에 저장된 신청 목록을 조회·엑셀(CSV) 다운로드할 수 있습니다.</p>
        <form id="login-form" class="admin-login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="admin-password">관리자 비밀번호</label>
            <input class="form-control" type="password" id="admin-password" name="password" autocomplete="current-password">
            <p class="field-error" id="err-login">비밀번호가 올바르지 않습니다.</p>
          </div>
          <div class="btn-group">
            <button class="btn btn-primary" type="submit">로그인</button>
          </div>
        </form>
      </div>

      <div class="content-card admin-app" id="admin-app" hidden>
        <div class="admin-toolbar">
          <h1 class="section-title"><span class="dot"></span>사전등록 DB 관리</h1>
          <div class="admin-toolbar-actions">
            <button type="button" class="btn btn-primary" id="btn-refresh">새로고침</button>
            <button type="button" class="btn btn-outline" id="btn-export">엑셀(CSV) 다운로드</button>
            <button type="button" class="btn btn-outline" id="btn-logout">로그아웃</button>
          </div>
        </div>
        <p class="form-hint" id="admin-status">총 <strong id="reg-count">0</strong>건</p>
        <p class="field-error admin-fetch-error" id="admin-fetch-error" hidden></p>
        <div class="notice-board admin-list-board reg-admin-board">
          <div class="reg-table-wrap">
            <table class="notice-table reg-admin-table">
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">신청일시</th>
                  <th scope="col">이름</th>
                  <th scope="col">소속</th>
                  <th scope="col">휴대폰</th>
                  <th scope="col">이메일</th>
                  <th scope="col">포럼참가</th>
                </tr>
              </thead>
              <tbody id="reg-list"></tbody>
            </table>
          </div>
        </div>
        <p class="notice-empty" id="reg-empty" hidden>등록된 신청이 없습니다.</p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/common.js"></script>
  <script src="js/register-admin.js"></script>
</body>
</html>
