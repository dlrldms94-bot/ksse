# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ksse
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: api/data
